apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: focusflow-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: focusflow-web
  template:
    metadata:
      labels:
        app: focusflow-web
    spec:
      containers:
        - name: focusflow-web
          image: focusflow-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: MONGODB_URI
              value: mongodb://db-service:27017/focusflow
            - name: NODE_ENV
              value: production
