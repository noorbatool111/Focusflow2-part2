version: '3.8'

services:
  focusflow-app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app 
      - app-node-cache:/app/node_modules
      - next-build-cache:/app/.next
    ports:
      - "4000:3000" 
    environment:
      - MONGODB_URI=mongodb://noor:noor123@cluster0-shard-00-00.ylkll.mongodb.net:27017,cluster0-shard-00-01.ylkll.mongodb.net:27017,cluster0-shard-00-02.ylkll.mongodb.net:27017/?ssl=true&replicaSet=atlas-le2i56-shard-0&authSource=admin&appName=Cluster0
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1024
    command: >
      sh -c "npm install --prefer-offline && npx next build && npx next start -- -p 3000"

volumes:
  app-node-cache:
  next-build-cache:
